name: Push
on:
  push:
    branches: ["main"]

jobs:
  filter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # get full history

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.5.0
        with:
          go-version: "1.27"
          cache-dependency-path: .github/cli/go.sum

      - name: Install cli
        working-directory: ./.github/cli
        run: go install ./cmd/trer

      - name: Check
        run: trer check

      - name: Show matrix
        run: trer matrix

      - id: set-matrix
        run: |
          cat << EOF >> $GITHUB_OUTPUT
          matrix=$(trer matrix)
          EOF

  push:
    runs-on: ubuntu-latest
    environment: tre
    needs: filter
    if: ${{ needs.filter.outputs.matrix != '{"include":[]}' }}
    strategy:
      matrix: ${{ fromJson(needs.filter.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.5.0
        with:
          go-version: "1.27"
          cache-dependency-path: .github/cli/go.sum

      - name: Install CLI
        working-directory: ./.github/cli
        run: go install ./cmd/trer

      - name: Build
        run: |
          # Create the build script and make it executable
          trer script ${MATRIX_DIRECTORY} > build.sh
          chmod +x build.sh

          # Remove all compressed objects
          rm -rf *.gz

          echo "Running"; cat build.sh
          ./build.sh
        env:
          MATRIX_DIRECTORY: ${{ matrix.directory }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE_NAME }}
          role-session-name: ${{ secrets.AWS_ROLE_NAME }}

      - name: Push
        run: |
          aws s3 cp . s3://${{ secrets.BUCKET_NAME }}/${MATRIX_DIRECTORY}/ \
            --recursive \
            --exclude "*" \
            --include "*.gz"
        env:
          MATRIX_DIRECTORY: ${{ matrix.directory }}
