name: PR

on:
  pull_request:
    branches: ["main"]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.5.0
        with:
          go-version: "1.27"
          cache-dependency-path: .github/cli/go.sum

      - name: Install CLI
        working-directory: ./.github/cli
        run: go install ./cmd/trer

      - name: Validate version bumps
        run: trer check
